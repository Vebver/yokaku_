<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RESTING - Hangout Restobar</title>

    <!-- 1. Path to icon and manifest simplified for Vite -->
    <link rel="icon" type="image/x-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- 2. PWA Registration moved into the Head for faster loading -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          // Set scope to include your selection and sub-pages
          navigator.serviceWorker
            .register("/service-worker.js", { scope: "/kiosk-selection" })
            .then(function (reg) {
              console.log("Kiosk PWA Active at: ", reg.scope);
            });
        });
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!-- Your React entry point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
