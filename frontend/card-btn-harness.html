<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/Style/AdminDashboard.css" />
  </head>
  <body class="p-3">
    <div class="row" style="width: 420px">
      <div class="col-6">
        <div class="card border-0 shadow-sm h-100">
          <div style="height: 3px; background: #10b981"></div>
          <div class="card-body p-2 d-flex flex-column">
            <div class="bg-light rounded-2 p-1 mb-2 border text-center">
              Table 1
            </div>
            <div class="mt-auto d-flex flex-column gap-1">
              <div class="d-flex flex-wrap gap-1 table-card-actions">
                <button
                  class="btn btn-sm btn-dark py-0 fw-bold flex-grow-1 flex-sm-grow-0 table-card-action table-card-primary-action"
                >
                  <svg width="11" height="11"></svg> Link
                </button>
                <button
                  class="btn btn-sm btn-danger py-0 fw-bold flex-grow-1 flex-sm-grow-0 table-card-action table-card-primary-action"
                >
                  Mark as Occupied
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <pre id="out"></pre>
    <script>
      const out = [];
      document.querySelectorAll(".table-card-actions button").forEach((b) => {
        const r = b.getBoundingClientRect();
        out.push({
          label: b.textContent.trim(),
          w: Math.round(r.width),
          h: Math.round(r.height),
          visible: r.width > 0 && r.height > 0,
        });
      });
      document.getElementById("out").textContent = JSON.stringify(out, null, 2);
    </script>
  </body>
</html>
